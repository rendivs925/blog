<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vortex Engine Simulator</title>
  <meta name="description" content="Interactive 3D simulation of the Ultimate Vortex Engine with real physics equations from superfluid vacuum theory." />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="scene-container"></div>

  <div id="hud">
    <div class="hud-title">VORTEX ENGINE</div>
    <div class="hud-row"><span class="hud-label">LIFT</span><span class="hud-val" id="hud-lift">0.0 N</span></div>
    <div class="hud-row"><span class="hud-label">POWER</span><span class="hud-val" id="hud-power">0.0 kW</span></div>
    <div class="hud-row"><span class="hud-label">COP</span><span class="hud-val" id="hud-cop">0.00</span></div>
    <div class="hud-row"><span class="hud-label">ΔP</span><span class="hud-val" id="hud-dp">0 Pa</span></div>
    <div class="hud-row"><span class="hud-label">RPM</span><span class="hud-val" id="hud-rpm">0</span></div>
    <div class="hud-row"><span class="hud-label">HV</span><span class="hud-val" id="hud-hv">0 kV</span></div>
    <div class="hud-row"><span class="hud-label">VORTEX</span><span class="hud-val" id="hud-vortex">—</span></div>
  </div>

  <div id="controls-panel">
    <div class="controls-title">CONTROLS</div>
    <div class="controls-group">
      <div class="control-row">
        <span class="ctrl-label">RPM</span>
        <input type="range" id="ctrl-rpm" min="0" max="10000" value="5000" step="100" />
        <span class="ctrl-val" id="val-rpm">5000</span>
      </div>
      <div class="control-row">
        <span class="ctrl-label">HV</span>
        <input type="range" id="ctrl-hv" min="0" max="50" value="25" step="1" />
        <span class="ctrl-val" id="val-hv">25 kV</span>
      </div>
      <div class="control-row">
        <span class="ctrl-label">LOAD</span>
        <input type="range" id="ctrl-load" min="0" max="100" value="50" step="1" />
        <span class="ctrl-val" id="val-load">50%</span>
      </div>
      <div class="control-row">
        <span class="ctrl-label">MAGNET</span>
        <input type="range" id="ctrl-magnet" min="0" max="150" value="100" step="1" />
        <span class="ctrl-val" id="val-magnet">1.00x</span>
      </div>
    </div>
    <div class="controls-group">
      <div class="control-row">
        <span class="ctrl-label">STEER X</span>
        <input type="range" id="ctrl-steerx" min="-100" max="100" value="0" step="1" />
        <span class="ctrl-val" id="val-steerx">0.0</span>
      </div>
      <div class="control-row">
        <span class="ctrl-label">STEER Y</span>
        <input type="range" id="ctrl-steery" min="-100" max="100" value="0" step="1" />
        <span class="ctrl-val" id="val-steery">0.0</span>
      </div>
    </div>
    <div class="controls-buttons">
      <button id="btn-play" class="ctrl-btn active">▶ RUN</button>
      <button id="btn-top" class="ctrl-btn">TOP</button>
      <button id="btn-side" class="ctrl-btn">SIDE</button>
      <button id="btn-orbit" class="ctrl-btn active">ORBIT</button>
    </div>
    <div class="controls-info">
      <span id="status-text" class="status-idle">INITIALIZING</span>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
