<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vortex Engine — Interactive Simulation</title>
  <meta name="description" content="Interactive 3D simulation of the vortex engine: counter-rotating discs, vacuum vortex dynamics, and energy extraction." />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="scene-container"></div>

  <div id="hud">
    <div class="hud-row"><span class="hud-label">Lift</span><span class="hud-val" id="hud-lift">0.00 N</span></div>
    <div class="hud-row"><span class="hud-label">Harvest</span><span class="hud-val" id="hud-power">0.00 kW</span></div>
    <div class="hud-row"><span class="hud-label">COP</span><span class="hud-val" id="hud-cop">0.00</span></div>
    <div class="hud-row"><span class="hud-label">Core ΔP</span><span class="hud-val" id="hud-dp">0 Pa</span></div>
    <div class="hud-row"><span class="hud-label">Speed</span><span class="hud-val" id="hud-rpm">0</span></div>
    <div class="hud-row"><span class="hud-label">Vortex</span><span class="hud-val" id="hud-vortex">—</span></div>
    <div class="hud-sep"></div>
    <div class="hud-row hud-tiny"><span class="hud-label">ρ vac</span><span class="hud-val" id="hud-density">0</span></div>
    <div class="hud-row hud-tiny"><span class="hud-label">Circ</span><span class="hud-val" id="hud-circulation">0</span></div>
    <div class="hud-row hud-tiny"><span class="hud-label">∇P</span><span class="hud-val" id="hud-gradient">0</span></div>
    <div class="hud-sep"></div>
    <div class="hud-row hud-tiny"><span class="hud-label">Input</span><span class="hud-val" id="hud-input">0 W</span></div>
    <div class="hud-row hud-tiny"><span class="hud-label">Loss</span><span class="hud-val" id="hud-loss">0 W</span></div>
    <div class="hud-row hud-tiny"><span class="hud-label">Net</span><span class="hud-val" id="hud-net">+0.0 W</span></div>
    <div class="hud-bar-wrap"><div class="hud-bar" id="hud-bar"></div></div>
  </div>

  <div id="controls-panel">
    <div class="controls-title">PARAMETERS</div>
    <div class="controls-cols">
      <div class="controls-col">
        <div class="control-row">
          <span class="ctrl-label">RPM</span>
          <input type="range" id="ctrl-rpm" min="0" max="10000" value="5000" step="100" aria-label="Disc rotation speed in RPM" />
          <span class="ctrl-val" id="val-rpm">5,000</span>
        </div>
        <div class="control-row">
          <span class="ctrl-label">HV</span>
          <input type="range" id="ctrl-hv" min="0" max="50" value="25" step="1" aria-label="High voltage bias in kV" />
          <span class="ctrl-val" id="val-hv">25 kV</span>
        </div>
        <div class="control-row">
          <span class="ctrl-label">Load</span>
          <input type="range" id="ctrl-load" min="0" max="100" value="50" step="1" aria-label="Coil load factor" />
          <span class="ctrl-val" id="val-load">50%</span>
        </div>
      </div>
      <div class="controls-col">
        <div class="control-row">
          <span class="ctrl-label">Magnet</span>
          <input type="range" id="ctrl-magnet" min="0" max="150" value="100" step="1" aria-label="Magnet strength multiplier" />
          <span class="ctrl-val" id="val-magnet">1.00x</span>
        </div>
        <div class="control-row">
          <span class="ctrl-label">Steer X</span>
          <input type="range" id="ctrl-steerx" min="-100" max="100" value="0" step="1" aria-label="Lateral steering X" />
          <span class="ctrl-val" id="val-steerx">0.00</span>
        </div>
        <div class="control-row">
          <span class="ctrl-label">Steer Y</span>
          <input type="range" id="ctrl-steery" min="-100" max="100" value="0" step="1" aria-label="Lateral steering Y" />
          <span class="ctrl-val" id="val-steery">0.00</span>
        </div>
      </div>
    </div>
    <div class="controls-buttons">
      <button id="btn-play" class="ctrl-btn active">RUN</button>
      <button id="btn-orbit" class="ctrl-btn active">Orbit</button>
      <button id="btn-top" class="ctrl-btn">Top</button>
      <button id="btn-side" class="ctrl-btn">Side</button>
      <span id="status-text" class="status-idle">Initializing</span>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
